[project]
name = "georges-utils"
readme = "README.md"
requires-python = ">=3.12,<3.16"
license-files = ["LICENSE"]
authors = [{ name = "George Ogden" }]
dependencies = []
dynamic = ["version"]

[project.urls]
Documentation = "https://george-ogden.github.io/python-utils/"
Homepage = "https://github.com/George-Ogden/python-utils/"
Issues = "https://github.com/George-Ogden/python-utils/issues/"
Repository = "https://github.com/George-Ogden/python-utils.git"

[project.entry-points.pytest11]
utils = "utils.plugins.pytest_plugin"

[dependency-groups]
dev = [
  "py-spy",
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "types" },
]
docs = [
  "mkdocs<2",
  "mkdocs-material",
  "mkdocstrings",
]
lint = [
  "linter==2.1.3",
  "prek",
  "ruff==0.17.2",
  "semgrep==1.181.1",
]
test = [
  "inline-snapshot",
  "pytest>=9.0.0",
  "pytest-dbg ; python_full_version >= '3.11'",
  "pytest-timeout",
  { include-group = "utils" },
]
types = [
  "mypy",
  "mypy-pytest-plugin ; python_full_version >= '3.12'",
  { include-group = "test" },
]
utils = [
  "extra-type-helpers ; python_full_version >= '3.12'",
  "georges-utils ; python_full_version >= '3.12'",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = ["version.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*"]
exclude = ["test*"]

[tool.uv.sources]
extra-type-helpers = { git = "https://github.com/George-Ogden/extra-types" }
georges-utils = { git = "https://github.com/George-Ogden/utils" }
linter = { git = "https://github.com/George-Ogden/linter/" }
mypy-pytest-plugin = { git = "https://github.com/George-Ogden/mypy-pytest" }
pytest-dbg = { git = "https://github.com/George-Ogden/pytest-dbg" }
